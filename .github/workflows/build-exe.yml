name: Build Windows EXE

# image_automation 도구를 Windows 실행파일(.exe)로 빌드합니다.
# 완성된 exe 는 실행 결과 페이지의 Artifacts 에서 다운로드할 수 있습니다.
on:
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능
  push:
    branches: ["claude/image-search-input-automation-dn5htx"]
    paths:
      - "image_automation/**"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: image_automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless mss pyautogui pyinstaller

      - name: Run matching self-test
        run: python tests/test_matching.py

      - name: Build exe
        run: >
          pyinstaller --onefile --name image_automation --clean
          --collect-submodules pyautogui
          --collect-submodules pyscreeze
          image_automation.py

      - name: Smoke test (exe launches)
        run: dist\image_automation.exe --help

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: image_automation-windows-exe
          path: image_automation/dist/image_automation.exe
          if-no-files-found: error
