<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>DOOMVIVOR — 둠 × 뱀서</title>
<link rel="stylesheet" href="style.css" />

<div id="game">
  <canvas id="view"></canvas>

  <!-- ===== In-game HUD ===== -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="stat"><span class="label">WAVE</span><span id="wave">1</span></div>
      <div class="stat"><span class="label">TIME</span><span id="time">0:00</span></div>
      <div class="stat"><span class="label">KILLS</span><span id="kills">0</span></div>
      <div class="stat"><span class="label">SCORE</span><span id="score">0</span></div>
    </div>

    <div id="combo" class="hidden">
      <span id="comboRank">D</span>
      <span id="comboMul">x1.0</span>
      <div id="comboBarWrap"><div id="comboBar"></div></div>
    </div>

    <div id="bottombar">
      <div class="meter">
        <div class="meterLabel">HP</div>
        <div class="bar"><div id="hpBar"></div><span id="hpText">100</span></div>
      </div>
      <div class="meter">
        <div class="meterLabel">LV <span id="level">1</span></div>
        <div class="bar xp"><div id="xpBar"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== Start screen ===== -->
  <div id="startScreen" class="overlay">
    <h1 class="logo">DOOM<span>VIVOR</span></h1>
    <p class="tag">둠 × 뱀서 · 1인칭 호드 서바이벌</p>
    <div class="controls">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 / 스트레이프</div>
      <div><kbd>MOUSE</kbd> 조준 &nbsp;·&nbsp; <kbd>CLICK</kbd> 사격(홀드 가능)</div>
      <div><kbd>SHIFT</kbd> 질주 &nbsp;·&nbsp; <kbd>ESC</kbd> 일시정지</div>
    </div>
    <button id="startBtn" class="btn">클릭해서 시작</button>
    <p class="hint">쉬지 말고 몰아쳐라 — 연속 처치가 곧 힘이다.</p>
  </div>

  <!-- ===== Level up ===== -->
  <div id="levelScreen" class="overlay hidden">
    <h2 class="lv">LEVEL UP</h2>
    <p class="sub">업그레이드 하나를 선택하세요</p>
    <div id="cards"></div>
  </div>

  <!-- ===== Pause ===== -->
  <div id="pauseScreen" class="overlay hidden">
    <h2>일시정지</h2>
    <button id="resumeBtn" class="btn">계속하기</button>
    <p class="hint">ESC 로 언제든 멈출 수 있어요.</p>
  </div>

  <!-- ===== Game over ===== -->
  <div id="overScreen" class="overlay hidden">
    <h1 class="dead">YOU DIED</h1>
    <div id="overStats"></div>
    <button id="restartBtn" class="btn">다시 시작 <kbd>R</kbd></button>
  </div>
</div>

<script src="game.js"></script>
